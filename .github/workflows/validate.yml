name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON templates
        run: |
          for f in templates/*/.claude/settings.json; do
            echo "checking $f"
            jq empty "$f"
            # every template must keep the secret-protection deny rules
            jq -e '.permissions.deny | index("Read(./.env)")' "$f" > /dev/null
          done

      - name: ShellCheck
        run: shellcheck scripts/*.sh

      - name: PowerShell syntax and PSScriptAnalyzer
        shell: pwsh
        run: |
          $errors = $null
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; throw "Syntax errors in $($f.Name)" }
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts -Severity Error
          if ($issues) { $issues; throw 'PSScriptAnalyzer found errors' }
